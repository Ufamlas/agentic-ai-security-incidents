<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Incident · AASIC</title><link rel="stylesheet" href="assets/site.css"></head><body><div class="top"><div class="wrap nav"><a class="brand" href="index.html">AASIC</a><a href="incidents.html">Incidents</a><a href="timeline.html">Timeline</a><a href="screening.html">Screening</a><a href="methodology.html">Methodology</a><a href="sources.html">Sources</a></div></div><main class="section"><div class="wrap prose" id="detail"></div></main><footer class="footer"><div class="wrap">AASIC · evidence-bounded research corpus · counts are not prevalence estimates.</div></footer><script src="assets/data.js"></script><script>(()=>{const e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])),id=new URLSearchParams(location.search).get("id"),x=(window.AASIC_DATA||[]).find(r=>r.id===id),d=document.getElementById("detail");if(!x){d.innerHTML="<h1>Record not found</h1>";return}const ec=x.effect_characterization||{};d.innerHTML=`<div class="eyebrow">${e(x.id)}</div><h1>${e(x.title)}</h1><p class="lede">${e(x.summary)}</p><table><tr><th>Event date</th><td>${e(x.event_date)}</td></tr><tr><th>Class</th><td>${e(x.record_class)}</td></tr><tr><th>Provider</th><td>${e(x.provider)}</td></tr><tr><th>Agent</th><td>${e(x.agent)}</td></tr><tr><th>Attempt</th><td>${x.attempt}</td></tr><tr><th>Boundary crossing</th><td>${x.boundary_crossing}</td></tr><tr><th>Effect</th><td>${x.effect}</td></tr><tr><th>Impact</th><td>${e(ec.impact_status||"legacy / uncoded")}</td></tr><tr><th>Compromise</th><td>${e(ec.compromise_status||"legacy / uncoded")}</td></tr><tr><th>Harm confirmed</th><td>${x.harm_confirmed}</td></tr><tr><th>Causal attribution</th><td>${e(x.causal_attribution)}</td></tr><tr><th>Actor attribution</th><td>${e(x.actor_attribution)}</td></tr></table><h2>Confirmed facts</h2><ul>${x.confirmed.map(v=>`<li>${e(v)}</li>`).join("")}</ul><h2>Effect / harm</h2><p>${e(x.harm)}</p><h2>Unresolved</h2><ul>${x.unresolved.map(v=>`<li>${e(v)}</li>`).join("")}</ul><h2>Sources</h2><ol>${x.sources.map(s=>`<li><a href="${e(s.url)}">${e(s.publisher)} (${e(s.date)})</a></li>`).join("")}</ol>`})();</script></body></html>
