<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Incidents · AASIC</title><link rel="stylesheet" href="assets/site.css"></head><body><div class="top"><div class="wrap nav"><a class="brand" href="index.html">AASIC</a><a href="incidents.html">Incidents</a><a href="timeline.html">Timeline</a><a href="screening.html">Screening</a><a href="methodology.html">Methodology</a><a href="sources.html">Sources</a></div></div><header class="hero"><div class="wrap"><div class="eyebrow">Incident explorer</div><h1>Browse the corpus.</h1><p class="lede">Search and filter without collapsing effect, harm and attribution.</p></div></header><main class="section"><div class="wrap"><div class="controls"><div class="cg"><div><label for="q">Search</label><input id="q" type="search"></div><div><label for="cls">Class</label><select id="cls"><option value="">All</option></select></div><div><label for="prov">Provider</label><select id="prov"><option value="">All</option></select></div><div><label for="harm">Harm</label><select id="harm"><option value="">Any</option><option value="1">Confirmed</option><option value="0">Not confirmed</option></select></div><div><label for="att">Attribution</label><select id="att"><option value="">Any</option></select></div></div><div class="toolbar"><span id="count" class="muted"></span><button id="reset" type="button">Reset</button></div></div><div id="rows"></div></div></main><footer class="footer"><div class="wrap">AASIC · evidence-bounded research corpus · counts are not prevalence estimates.</div></footer><script src="assets/data.js"></script><script>(()=>{const D=window.AASIC_DATA||[],$=x=>document.getElementById(x),e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const q=$("q"),cls=$("cls"),prov=$("prov"),harm=$("harm"),att=$("att"),rows=$("rows"),count=$("count");const u=k=>[...new Set(D.map(x=>x[k]).filter(Boolean))].sort();u("record_class").forEach(v=>cls.insertAdjacentHTML("beforeend",`<option>${e(v)}</option>`));u("provider").forEach(v=>prov.insertAdjacentHTML("beforeend",`<option>${e(v)}</option>`));u("actor_attribution").forEach(v=>att.insertAdjacentHTML("beforeend",`<option>${e(v)}</option>`));function r(){let n=q.value.toLowerCase();let a=D.filter(x=>[x.id,x.title,x.provider,x.agent,x.summary,...x.tags].join(" ").toLowerCase().includes(n)&&(!cls.value||x.record_class===cls.value)&&(!prov.value||x.provider===prov.value)&&(!att.value||x.actor_attribution===att.value)&&(!harm.value||(harm.value==="1"?x.harm_confirmed:!x.harm_confirmed)));count.textContent=`${a.length} of ${D.length}`;rows.innerHTML=a.map(x=>`<article class="row"><div><div class="mono">${e(x.id)}</div><div class="muted">${e(x.event_date)}</div></div><div><h3>${e(x.title)}</h3><div class="muted">${e(x.provider)} · ${e(x.agent)}</div><p>${e(x.summary)}</p><div class="badges"><span class="badge">${e(x.record_class)}</span>${x.effect?'<span class="badge ok">effect</span>':''}${x.harm_confirmed?'<span class="badge danger">harm</span>':''}</div></div><div><a class="button" href="incident.html?id=${encodeURIComponent(x.id)}">Details</a></div></article>`).join("")} [q,cls,prov,harm,att].forEach(x=>{x.addEventListener("input",r);x.addEventListener("change",r)});$("reset").onclick=()=>{q.value=cls.value=prov.value=harm.value=att.value="";r()};r()})();</script></body></html>
